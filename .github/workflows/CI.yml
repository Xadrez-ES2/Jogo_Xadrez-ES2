name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Criar arquivo .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf "%s\n" "$ENV_FILE" > .env

      - name: Testes
        run: npm test -- --reporter=default --reporter=json --outputFile=coverage/regression-results.json

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Cobertura de unidade e integração da interface
        run: |
          npm run coverage:interface:unit
          npm run coverage:interface:integration

      - name: Guardar evidências de unidade e integração
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-unidade-integracao-interface
          path: |
            app/coverage/interface-unit/
            app/coverage/interface-integration/
            app/coverage/regression-results.json
          if-no-files-found: ignore

      - name: Upload do artefato para o Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  interface-system:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Testes de sistema da interface e cobertura
        run: npm run coverage:interface:system
      - name: Guardar resultados e evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-sistema-interface
          path: |
            app/coverage/interface-system/
            app/.vitest/attachments/
          include-hidden-files: true
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [test, interface-system]
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
